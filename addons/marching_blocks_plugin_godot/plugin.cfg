[plugin]

name="MarchingBlocks"
description="Paint NON-CUBIC 3D tiles in a GridMap. The artist sculpts one master block; the plugin slices it on the cell mid-planes, classifies every piece among the marching-blocks configurations, and builds the MeshLibrary the brush assembles. A panel in the right strip of the 3D view: export the witness, reimport it sculpted, paint."
author="MarchingBlocks"
version="1.0"
script="PluginMarchingBlocks.gd"
