[plugin]

name="Undermend"
description="Peindre des tuiles 3D NON CUBIQUES dans un GridMap. L'artiste sculpte neuf blocs maîtres dans Blender ; le greffon les tranche sur les plans médians, classe chaque morceau parmi les 68 configurations de la grille duale, et monte la MeshLibrary que le pinceau assemble. Un panneau dans la bande de droite de la vue 3D : exporter le MasterBlockSet, le réimporter sculpté, peindre."
author="Undermend"
version="1.0"
script="PluginUndermend.gd"
